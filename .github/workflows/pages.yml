name: Pages

# The web data converter (web/): built and published to the gh-pages branch,
# which GitHub Pages serves. The page runs tools/*.py in the browser, so a
# change to the converter publishes it again too. Only the page and the
# scripts go out: no game data, and not ANNIHILA.TOS, which the release
# workflow builds.

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'tools/*.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Write, to push the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # what stops a manual dispatch from some other branch publishing it
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # Before setup-node, so that its pnpm cache has a pnpm to find.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # The test that converts the demo skips itself without the
      # installer, and there is none here: no game data goes near this
      # repository.
      - run: pnpm test
      - run: pnpm run build

      - name: Publish to gh-pages
        # The built page alone, as one commit replacing whatever was there:
        # the branch is output, and its history would only be old builds.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "The data converter, from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
