name: PR

# Does it build? That is the whole job. This runs the same build as
# release.yml, so a pull request that would break the release fails here
# instead, and it publishes nothing and keeps no artifacts. The tests in
# tests/ need the demo's data and Hatari, which a runner does not have:
# run them with `make test` (docs/testing.md).

on:
  pull_request:
    branches:
      - main
    # Documentation and the web converter (pages.yml builds that) cannot
    # break this build (the same list as release.yml).
    # Nothing on main requires this check: if a rule ever does, these pull
    # requests would wait on it forever, so drop this filter then.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'web/**'
  workflow_dispatch:

# Read-only: this workflow runs code from a contributor's branch, so it
# gets nothing it does not need. release.yml holds the write token.
permissions:
  contents: read

# A force-push mid-review should not leave two builds racing to report.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: neilrackett/atarist-toolkit-docker-x86_64:mintelf
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build ANNIHILA.TOS
        run: make
